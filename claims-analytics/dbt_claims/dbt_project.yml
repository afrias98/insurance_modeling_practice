name: 'dbt_claims'
version: '1.0.0'
config-version: 2

profile: 'dbt_claims'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_claims:

    bronze:
      +schema: bronze
      +materialized: view

    silver:
      +schema: silver
      +materialized: table

    gold:
      +schema: gold
      +materialized: table

    src:
      +schema: raw
      +materialized: view