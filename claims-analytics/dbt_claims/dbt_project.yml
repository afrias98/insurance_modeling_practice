name: 'dbt_claims'
version: '1.0.0'
config-version: 2

profile: 'dbt_claims'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_claims:

    # -------------------------
    # BRONZE LAYER (staging)
    # -------------------------
    bronze:
      +materialized: view
      +tags: ["bronze"]

    # -------------------------
    # SILVER LAYER (dimensions, SCD2, cleaned entities)
    # -------------------------
    silver:
      +materialized: table
      +tags: ["silver"]

    # -------------------------
    # GOLD LAYER (facts, marts)
    # -------------------------
    gold:
      +materialized: table
      +tags: ["gold"]

    # -------------------------
    # SOURCES (RAW)
    # -------------------------
    src:
      +tags: ["raw"]
